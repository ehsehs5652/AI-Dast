name: Windows process controls

on:
  push:
  pull_request:

jobs:
  windows-process-controls:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest "httpx>=0.27,<1"
      - run: python -m pytest -q tests/test_windows_process_control.py tests/test_scope_workflow.py::ScopeProcessControlTests tests/test_web_dashboard.py::test_windows_scan_pause_continue_and_cancel_after_restart
